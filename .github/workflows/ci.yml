name: Verify

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            expected_head_sha:
                description: Exact source requested by the trusted dependency controller
                required: false
                default: ""
                type: string

permissions:
    contents: read
    packages: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  package-manager-cache: false
            - name: Require the requested dependency source
              env:
                  EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
              run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
            - run: node --test infra/nx-tasks/src/executors/dependabot-merge/createDependabotAutomation.spec.mjs
            - run: corepack enable
            - run: yarn install --immutable
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - run: yarn agents:check
            - run: yarn agents:mcp-check
            - run: yarn build
            - run: yarn nx run cursor-adapter-mosaik:generate:check
            - run: yarn nx run nx-tasks:typecheck
            - run: yarn docs:check
            - run: yarn test
            - name: Install test renderers
              run: |
                  yarn exec playwright install --with-deps chromium
                  yarn workspace @pixel-brewery/cursor-reference electron:install
            - run: yarn test:adapters
            - run: xvfb-run -a yarn test:demo
            - run: python3 .agents/skills/designer/scripts/check_design.py --app apps/reference
            - name: Verify generated files are current
              run: |
                  yarn agents:sync
                  git diff --exit-code
                  test -z "$(git status --porcelain)"
